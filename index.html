<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Akul 💘 Sona</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: pink;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      width: 340px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 15px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      font-weight: bold;
    }

    #no {
      background: #ccc;
      position: absolute;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Akul, my putta ❤️</h1>
    <p>Will you be my Valentine?</p>

    <button id="yes" onclick="yesClicked()">Yes 🤍</button>
    <button id="no">No</button>
  </div>

  <script>
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    function yesClicked() {
      document.body.innerHTML = `
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;text-align:center;padding:20px;">
          <h1>
            Yay 💕<br><br>
            Let's plan something and spend time together.<br><br>
            And by next Valentine's we’ll be living together yaaay ❤️<br><br>
            XOXO<br>
            Your loving girlfriend
          </h1>
        </div>
      `;
    }
  </script>

</body>
</html>
